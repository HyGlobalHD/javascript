<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHA-256 Brute Force with Firestore</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
        }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            text-align: left;
            max-height: 300px;
            overflow-y: scroll;
            border: 1px solid #333;
            padding: 10px;
            background-color: #1e1e1e;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #4caf50;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        input {
            margin: 10px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>
    <h1>SHA-256 Brute Force with Firestore</h1>
    <label>
        Target Hash:
        <input type="text" id="target-hash" placeholder="Enter target hash" value="513d246e0efb088ade89714bf68279b8ac0eb5452be47a3d55efc081b3df74fa">
    </label>
    <br>
    <label>
        Combination Length:
        <input type="number" id="combination-length" value="24" min="1">
    </label>
    <div>
        <button id="start-btn">Start Brute Force</button>
        <button id="pause-btn" disabled>Pause</button>
        <button id="resume-btn" disabled>Resume</button>
    </div>
    <div>
        Combinations Tried: <span id="combinations-tried">0</span>
    </div>
    <div id="output"></div>

<script type="module">
    // Import the Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, writeBatch, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDK9UIDrsk4N0Fy0h4HHZBq6D3jjsoH1ow",
        authDomain: "sha256-db.firebaseapp.com",
        projectId: "sha256-db",
        storageBucket: "sha256-db.appspot.com",
        messagingSenderId: "253461252485",
        appId: "1:253461252485:web:0bf310b4774957ce875cec",
    };

    // Initialize Firebase and Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const combinationsRef = collection(db, "combinations");

    const charset = "abcdefghijklmnopqrstuvwxyz0123456789";
    const chunkSize = 25;
    const maxLogEntries = 5;

    const combinationsTriedDisplay = document.getElementById("combinations-tried");
    const outputDiv = document.getElementById("output");
    const startBtn = document.getElementById("start-btn");
    const pauseBtn = document.getElementById("pause-btn");
    const resumeBtn = document.getElementById("resume-btn");
    const targetHashInput = document.getElementById("target-hash");
    const combinationLengthInput = document.getElementById("combination-length");

    let combinationsTried = 0;
    let running = false;

    async function sha256(message) {
        const encoder = new TextEncoder();
        const data = encoder.encode(message);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuffer))
            .map((b) => b.toString(16).padStart(2, "0"))
            .join("");
    }

    function generateRandomString(length) {
        let result = "";
        for (let i = 0; i < length; i++) {
            result += charset.charAt(Math.floor(Math.random() * charset.length));
        }
        return result;
    }

    async function doesHashExist(hash) {
        const querySnapshot = await getDocs(query(combinationsRef, where("hash", "==", hash)));
        return !querySnapshot.empty;
    }

    async function doesCombinationExist(combination) {
        const querySnapshot = await getDocs(query(combinationsRef, where("combination", "==", combination)));
        return !querySnapshot.empty;
    }

    async function storeBatchToFirestore(batchData) {
        const batch = writeBatch(db);

        for (const { combination, hash } of batchData) {
            if (!(await doesCombinationExist(combination))) {
                const newDocRef = doc(combinationsRef);
                batch.set(newDocRef, { combination, hash });
            } else {
                outputDiv.textContent += `Skipped duplicate: ${combination}\n`;
                outputDiv.scrollTop = outputDiv.scrollHeight;
            }
        }

        try {
            await batch.commit();
        } catch (error) {
            console.error("Error writing batch to Firestore: ", error);
        }
    }

    async function bruteForceChunk() {
        const batchData = [];
        for (let i = 0; i < chunkSize; i++) {
            if (!running) return false;

            const candidate = generateRandomString(parseInt(combinationLengthInput.value, 10));
            const candidateHash = await sha256(candidate);
            combinationsTried++;
            combinationsTriedDisplay.textContent = combinationsTried.toLocaleString();

            batchData.push({ combination: candidate, hash: candidateHash });

            const logEntry = `Trying: ${candidate} -> ${candidateHash}\n`;
            outputDiv.textContent += logEntry;
            outputDiv.scrollTop = outputDiv.scrollHeight;

            if (candidateHash === targetHashInput.value.trim()) {
                outputDiv.textContent += `Match found! The string is: ${candidate}\n`;
                outputDiv.scrollTop = outputDiv.scrollHeight;
                return true;
            }
        }

        if (batchData.length > 0) {
            await storeBatchToFirestore(batchData);
        }

        return false;
    }

    async function bruteForce() {
        startBtn.disabled = true;
        pauseBtn.disabled = false;
        resumeBtn.disabled = true;

        running = true;

        const targetHash = targetHashInput.value.trim();
        if (await doesHashExist(targetHash)) {
            outputDiv.textContent = `Target hash already exists in the database.\n`;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            return;
        }

        outputDiv.textContent += "Starting brute force...\n";

        while (running) {
            const found = await bruteForceChunk();
            if (found) break;
            await new Promise((resolve) => setTimeout(resolve, 100)); // Delay to avoid rate limits
        }

        if (!running) {
            outputDiv.textContent += "Brute force paused.\n";
            return;
        }

        startBtn.disabled = false;
        pauseBtn.disabled = true;
        outputDiv.textContent += "Brute force complete.\n";
    }

    function pauseBruteForce() {
        running = false;
        pauseBtn.disabled = true;
        resumeBtn.disabled = false;
    }

    function resumeBruteForce() {
        resumeBtn.disabled = true;
        pauseBtn.disabled = false;

        running = true;
        bruteForce();
    }

    startBtn.addEventListener("click", () => {
        combinationsTried = 0;
        outputDiv.textContent = "";
        bruteForce();
    });

    pauseBtn.addEventListener("click", pauseBruteForce);
    resumeBtn.addEventListener("click", resumeBruteForce);
</script>

</body>
</html>
