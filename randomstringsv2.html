<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Processor with Encryption</title>
</head>
<body>
    <div id="output"></div>
    <button id="copyButton">Copy to Clipboard</button>
    <button id="retryButton">Retry</button>

    <script>
        // Function to fetch and process data
        async function fetchAndProcessData() {
            // Fetch the strings from the given URL
            try {
                const response = await fetch('https://www.random.org/strings/?num=4&len=32&digits=on&upperalpha=on&loweralpha=on&unique=on&format=plain&rnd=new');
                let data = await response.text();
                // Remove newline characters and spaces
                let processedData = data.replace(/\s+/g, '');

                // Shift the characters randomly
                let shiftedData = shiftString(processedData);

                // Encrypt the shifted string with SHA-256
                let encryptedData = await sha256(shiftedData);

                // Display the encrypted string
                document.getElementById('output').textContent = encryptedData;
            } catch (error) {
                console.error('Error fetching the strings:', error);
            }
        }

        // Function to shift each character in the string by a random amount
        function shiftString(input) {
            return input.split('').map(char => {
                // Random shift between 1 and 5
                const shift = Math.floor(Math.random() * 5) + 1;
                return String.fromCharCode(char.charCodeAt(0) + shift);
            }).join('');
        }

        // Function to generate SHA-256 hash
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            // Ensure the result is truncated to 128 characters max
            return hashHex.slice(0, 128);
        }

        // Function to copy output to clipboard
        document.getElementById('copyButton').addEventListener('click', () => {
            const outputText = document.getElementById('output').textContent;
            navigator.clipboard.writeText(outputText).then(() => {
               // alert("Copied to clipboard!");
            }).catch(error => {
                console.error("Error copying to clipboard:", error);
            });
        });

        // Retry function to fetch data again
        document.getElementById('retryButton').addEventListener('click', fetchAndProcessData);

        // Initial fetch on page load
        fetchAndProcessData();
    </script>
</body>
</html>
