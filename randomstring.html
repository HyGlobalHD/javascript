<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Processor</title>
    <style>
        /* Dark background and light text for dark mode effect */
        body {
            background-color: #1e1e1e; /* Dark color */
            color: #ffffff; /* Light color for text */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* Container to keep output within screen limits */
        .container {
            max-width: 90%; /* Ensures container doesn't exceed screen width */
            overflow-wrap: break-word; /* Breaks long strings to fit within container */
            text-align: center;
        }

        #output, #finalOutput {
            color: #ffffff; /* White color for output text */
            background-color: #333333; /* Slightly lighter dark for output box */
            padding: 20px;
            border-radius: 8px;
            font-size: 1.2em;
            margin-bottom: 20px;
            word-wrap: break-word; /* Ensures text wraps within container */
        }

        button, input[type="range"] {
            background-color: #444444; /* Dark button background */
            color: #ffffff; /* Light text for button */
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover, input[type="range"]:hover {
            background-color: #555555; /* Slightly lighter on hover */
        }

        /* Style for the slider */
        #sliderContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        #sliderLabel {
            margin-bottom: 5px;
        }

        /* Checkbox container */
        .checkbox-container {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        /* Loading indicator style */
        #loadingIndicator {
            font-size: 1.2em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="output">Loading...</div>
        <div id="hashOutput"></div>
        <div id="uniqueNumberOutput"></div>
        <div id="finalOutput"></div>
    </div>    
    <button id="retryButton">Retry</button>
    <button id="copyButton">Copy Initial Output</button>
    <button id="copyFinalButton">Copy Final Output</button>
    <button id="downloadButton">Download Final Output</button>
    <div id="loadingIndicator" style="display: none;">Processing...</div>

    <div class="checkbox-container">
        <label><input type="checkbox" id="enableTrim" checked> Enable Trim</label>
        <label><input type="checkbox" id="enableShuffle" checked> Enable Shuffle</label>
    </div>

    <div id="sliderContainer">
        <div id="sliderLabel">Trim Output Length (0-123): <span id="sliderValue">0</span></div>
        <input type="range" id="outputTrimSlider" min="0" max="123" value="0">
    </div>
    <div id="lengthIndicator">Current Length: 0</div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let initialOutput = ""; // Variable to hold original fetched output

            async function fetchAndProcessData() {
                showLoading(true);
                // Fetch the strings from the given URL
                fetch('https://www.random.org/strings/?num=4&len=32&digits=on&upperalpha=on&format=plain&rnd=new')
                    .then(response => response.text())
                    .then(data => {
                        // Remove newline characters and spaces
                        initialOutput = data.replace(/\s+/g, '');
                        // Display the processed string
                        document.getElementById('output').textContent = initialOutput;
                        processAndShuffleOutput();
                    })
                    .catch(error => {
                        console.error('Error fetching the strings:', error);
                    })
                    .finally(() => showLoading(false));
            }

            async function sha256(message) {
                const msgBuffer = new TextEncoder().encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                return hashHex;
            }

            function seededShuffle(array, seed) {
                for (let i = array.length - 1; i > 0; i--) {
                    const randomIndex = seed % (i + 1);
                    [array[i], array[randomIndex]] = [array[randomIndex], array[i]];
                    seed = Math.floor(seed / 1.1);
                }
                return array;
            }

            async function processAndShuffleOutput() {
                showLoading(true);
                const trimLength = parseInt(document.getElementById('outputTrimSlider').value);
                const enableTrim = document.getElementById('enableTrim').checked;
                const enableShuffle = document.getElementById('enableShuffle').checked;

                let trimmedOutput = enableTrim 
                    ? initialOutput.slice(0, Math.max(0, initialOutput.length - trimLength))
                    : initialOutput;

                document.getElementById('output').textContent = trimmedOutput || "No data available.";
                document.getElementById('lengthIndicator').textContent = `Current Length: ${trimmedOutput.length}`;

                if (trimmedOutput === "") {
                    document.getElementById('finalOutput').textContent = "Final Output: N/A";
                    showLoading(false);
                    return;
                }

                const hash = await sha256(trimmedOutput);
                document.getElementById('hashOutput').textContent = `Hash: ${hash}`;
                
                const uniqueNumber = (parseInt(hash.slice(0, 8), 16) % 100000000) + 1;
                document.getElementById('uniqueNumberOutput').textContent = `Unique Number: ${uniqueNumber}`;

                const shuffledArray = enableShuffle 
                    ? seededShuffle(trimmedOutput.split(''), uniqueNumber) 
                    : trimmedOutput.split('');
                    
                const finalOutput = shuffledArray.join('');
                document.getElementById('finalOutput').textContent = `Final Output: ${finalOutput}`;
                showLoading(false);
            }

            function showToast(message) {
                const toast = document.createElement("div");
                toast.textContent = message;
                toast.style = `
                    position: fixed;
                    bottom: 20px;
                    right: 20px;
                    background: #444;
                    color: #fff;
                    padding: 10px 20px;
                    border-radius: 5px;
                    opacity: 0.9;
                    transition: opacity 0.5s;
                `;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 500);
                }, 1500);
            }

            function showLoading(show) {
                document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
            }

            document.getElementById('copyButton').addEventListener('click', () => {
                const outputText = document.getElementById('output').textContent;
                navigator.clipboard.writeText(outputText).then(() => {
                    showToast("Initial Output Copied to clipboard!");
                }).catch(error => {
                    console.error("Error copying to clipboard:", error);
                });
            });

            document.getElementById('copyFinalButton').addEventListener('click', () => {
                const finalOutputText = document.getElementById('finalOutput').textContent.replace('Final Output: ', '');
                navigator.clipboard.writeText(finalOutputText).then(() => {
                    showToast("Final Output Copied to clipboard!");
                }).catch(error => {
                    console.error("Error copying to clipboard:", error);
                });
            });

            document.getElementById('downloadButton').addEventListener('click', () => {
                const finalOutputText = document.getElementById('finalOutput').textContent.replace('Final Output: ', '');
                const blob = new Blob([finalOutputText], { type: 'text/plain' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "FinalOutput.txt";
                link.click();
            });

            document.getElementById('retryButton').addEventListener('click', fetchAndProcessData);

            const slider = document.getElementById('outputTrimSlider');
            const sliderValueLabel = document.getElementById('sliderValue');
            slider.addEventListener('input', () => {
                sliderValueLabel.textContent = slider.value;
                processAndShuffleOutput();
            });

            fetchAndProcessData();
        });
    </script>
</body>
</html>
