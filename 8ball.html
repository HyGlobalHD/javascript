<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Ball Mini Game</title>
</head>
<body>
    <script>
        const responses = [
            'It is certain.', 'It is decidedly so.', 'Without a doubt.', 'Yes – definitely.',
            'You may rely on it.', 'As I see it, yes.', 'Most likely.', 'Outlook good.', 
            'Yes.', 'Signs point to yes.', 'Absolutely.', 'Indeed.', 'You got it!', 
            'No question.', 'Sure thing.', 'Definitely.', 'Of course.', 
            'Yes, in due time.', 'Positively!', 'Chances are high.', 'Affirmative.',
            'Count on it.', 'Absolutely yes.', 'No worries.', 'Sure, why not?', 
            'No way!', 'Absolutely not.', 'Not a chance.', 'Very doubtful.',
            'Outlook not so good.', 'My sources say no.', 'Nope.', 'Don\'t bet on it.', 
            'My reply is no.', 'I doubt it.', 'Not in a million years.', 'No, for now.', 
            'Unlikely.', 'Forget about it.', 'Outlook is bleak.', 'Better not tell you now.', 
            'Cannot predict now.', 'Ask again later.', 'Concentrate and ask again.',
            'Reply hazy, try again.', 'Try again.', 'Maybe.', 'It\'s possible.', 
            'I can’t say.', 'It\'s unclear.', 'Not sure, ask later.', 'Uncertain.', 
            'The answer isn’t clear.', 'Focus and ask again.', 'That\'s a tough one.', 
            'The stars are unclear.', 'Can’t decide now.', 'Patience, and ask again.', 
            'Indeterminate.', 'Hold on.', 'Inconclusive.', 'It’s up in the air.', 
            'Wait and see.', 'Time will tell.', 'Fate is undecided.'
        ];

        fetch('https://www.random.org/decimal-fractions/?num=1&dec=20&col=1&format=plain&rnd=new')
            .then(response => response.text())
            .then(data => {
                const randomDecimal = parseFloat(data.trim());
                const randomIndex = Math.floor(randomDecimal * responses.length);
                document.write(responses[randomIndex]); // Use document.write to output as plain text
            })
            .catch(error => {
                document.write('Error fetching answers. Please try again.');
                console.error('Error:', error);
            });
    </script>
</body>
</html>
