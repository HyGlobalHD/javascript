<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHA-256 Brute Force with Web Workers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
        }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            text-align: left;
            max-height: 300px;
            overflow-y: scroll;
            border: 1px solid #333;
            padding: 10px;
            background-color: #1e1e1e;
        }
        #progress-bar-container {
            margin-top: 20px;
            width: 100%;
            height: 20px;
            background-color: #333;
            border-radius: 10px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #4caf50;
            transition: width 0.1s ease;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #4caf50;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>SHA-256 Brute Force</h1>
    <label>
        Target Hash:
        <input type="text" id="target-hash" placeholder="Enter target hash" value="0fad2932464a554f7a2d07fd87a44a2686dc65c7e6dd87f911707e8a33b4529e">
    </label>
    <br>
    <label>
        Combination Length:
        <input type="number" id="combination-length" value="24" min="1">
    </label>
    <br>
    <label>
        Web Workers (1-5):
        <input type="number" id="worker-count" value="4" min="1" max="5">
    </label>
    <p>Total Combinations: <span id="total-combinations"></span></p>
    <p>Combinations Tried: <span id="combinations-tried">0</span></p>
    <p>Workers Used: <span id="workers-used">4</span></p>
    <p>Estimated Time Remaining: <span id="estimated-time">Calculating...</span></p>
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>
    <div>
        <button id="start-btn">Start Brute Force</button>
        <button id="pause-btn" disabled>Pause</button>
        <button id="resume-btn" disabled>Resume</button>
    </div>
    <div id="output"></div>

    <script>
        const charset = "abcdefghijklmnopqrstuvwxyz0123456789";
        let totalCombinations = BigInt(0);
        let combinationsTried = 0;
        let combinationsPerSecond = 0;
        let running = false;

        const totalCombinationsDisplay = document.getElementById("total-combinations");
        const combinationsTriedDisplay = document.getElementById("combinations-tried");
        const progressBar = document.getElementById("progress-bar");
        const outputDiv = document.getElementById("output");
        const startBtn = document.getElementById("start-btn");
        const pauseBtn = document.getElementById("pause-btn");
        const resumeBtn = document.getElementById("resume-btn");
        const targetHashInput = document.getElementById("target-hash");
        const combinationLengthInput = document.getElementById("combination-length");
        const workerCountInput = document.getElementById("worker-count");
        const workersUsedDisplay = document.getElementById("workers-used");
        const estimatedTimeDisplay = document.getElementById("estimated-time");

        let workers = [];
        let numWorkers = parseInt(workerCountInput.value, 10);

        workerCountInput.addEventListener("change", () => {
            numWorkers = Math.max(1, Math.min(5, parseInt(workerCountInput.value, 10))); // Clamp between 1 and 5
            workersUsedDisplay.textContent = numWorkers;
        });

        let lastCheckedTime = Date.now();
        let lastCheckedCombinations = 0;

        function updateTotalCombinations(length) {
            totalCombinations = BigInt(charset.length) ** BigInt(length);
            totalCombinationsDisplay.textContent = totalCombinations.toLocaleString();
        }

  let throttleUpdateStatsTimeout;
        
        function updateStats() {
      clearTimeout(throttleUpdateStatsTimeout);
      throttleUpdateStatsTimeout = setTimeout(() => {
          combinationsTriedDisplay.textContent = combinationsTried.toLocaleString();
          const progress = (combinationsTried / Number(totalCombinations)) * 100;
          progressBar.style.width = `${progress.toFixed(2)}%`;
          const elapsedTime = (Date.now() - startTime) / 1000; // Use Start time to track.
          combinationsPerSecond = combinationsTried/ elapsedTime; //Calculate using start time.

          if (combinationsPerSecond > 0) {
              const remainingCombinations = Number(totalCombinations) - combinationsTried;
              const remainingTimeInSeconds = remainingCombinations / combinationsPerSecond;
              estimatedTimeDisplay.textContent = formatTime(remainingTimeInSeconds);
          } else {
              estimatedTimeDisplay.textContent = "Calculating...";
          }

      }, 200); // Update stats every 500ms
        }

        function formatTime(seconds) {
            const units = [
                { label: "millennium", value: 31_536_000_000 },
                { label: "century", value: 3_153_600_000 },
                { label: "decade", value: 315_360_000 },
                { label: "year", value: 31_536_000 },
                { label: "month", value: 2_592_000 },
                { label: "week", value: 604_800 },
                { label: "day", value: 86_400 },
                { label: "hour", value: 3_600 },
                { label: "minute", value: 60 },
                { label: "second", value: 1 },
            ];

            let remainingSeconds = seconds;
            const timeParts = [];

            for (const unit of units) {
                const count = Math.floor(remainingSeconds / unit.value);
                if (count > 0) {
                    timeParts.push(`${count} ${unit.label}${count > 1 ? "s" : ""}`);
                    remainingSeconds %= unit.value;
                }
            }

            return timeParts.length > 0 ? timeParts.join(", ") : "less than a second";
        }

        function logMessage(message) {
            const logs = outputDiv.textContent.split("\n").filter(line => line.trim() !== "");
            if (logs.length >= 10) logs.shift();
            logs.push(message);
            outputDiv.textContent = logs.join("\n");
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

let paused = false;
    let startTime; //Variable for timing estimation

function startBruteForce() {
    const targetHash = targetHashInput.value.trim();
    const length = parseInt(combinationLengthInput.value, 10);

    if (!targetHash || targetHash.length !== 64) {
        logMessage("Invalid target hash. Please enter a valid 64-character SHA-256 hash.");
        return;
    }

    if (!paused) {
        combinationsTried = 0; // Only reset if not resuming
        updateTotalCombinations(length);
        outputDiv.textContent = "";
        startTime = Date.now();// Initialize Start time
    }

    running = true;
    paused = false;
    pauseBtn.disabled = false;
    resumeBtn.disabled = true;
    startBtn.disabled = true;

    const combinationsPerWorker = Math.ceil(Number(totalCombinations) / numWorkers);
    // Start or resume workers
    for (let i = workers.length; i < numWorkers; i++) {
        const worker = new Worker("worker.js");

        // Send initialization data or resumption data
            worker.postMessage({
                targetHash,
                charset,
                length,
                workerId: i + 1,
                startFrom: combinationsPerWorker * i , // more accurate start calculation.
                combinationsPerWorker: combinationsPerWorker
            });

        // Handle messages from the worker
        worker.onmessage = (e) => {
            const { combinations, found, candidate, combinationString, workerId, hashedString } = e.data;

            combinationsTried += combinations;
            updateStats();

            logMessage(`Worker ${workerId}: Tried ${combinationString} --> ${hashedString}`);
            //console.log(`Worker ${workerId}: Tried ${combinationString} --> ${hashedString}`);

            if (found) {
                logMessage(`Worker ${workerId} found the match! The string is: ${candidate}`);
                alert(`Match found! The string is: ${candidate}`);
                terminateAllWorkers();
                pauseBtn.disabled = true;
                resumeBtn.disabled = true;
                startBtn.disabled = false;
                return;
            }
        };

        workers.push(worker);
    }
}

function pauseBruteForce() {
    running = false;
    paused = true;
    pauseBtn.disabled = true;
    resumeBtn.disabled = false;

    // Terminate workers but keep progress
    workers.forEach((worker) => worker.terminate());
    workers = [];
    logMessage("Brute force paused.");
}

function resumeBruteForce() {
    running = true;
    pauseBtn.disabled = false;
    resumeBtn.disabled = true;
    startBruteForce(); // Resumes progress
}



function terminateAllWorkers() {
    workers.forEach((worker) => worker.terminate());
    workers = [];
}


        startBtn.addEventListener("click", startBruteForce);
        pauseBtn.addEventListener("click", pauseBruteForce);
        resumeBtn.addEventListener("click", resumeBruteForce);
    </script>
</body>
</html>
