<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHA-256 Brute Force</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
        }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            text-align: left;
            max-height: 300px;
            overflow-y: scroll;
            border: 1px solid #333;
            padding: 10px;
            background-color: #1e1e1e;
        }
        #progress-bar-container {
            margin-top: 20px;
            width: 100%;
            height: 20px;
            background-color: #333;
            border-radius: 10px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #4caf50;
            transition: width 0.1s ease;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #4caf50;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        input {
            margin: 10px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>
    <h1>SHA-256 Brute Force</h1>
    <label>
        Target Hash:
        <input type="text" id="target-hash" placeholder="Enter target hash" value="0fad2932464a554f7a2d07fd87a44a2686dc65c7e6dd87f911707e8a33b4529e">
    </label>
    <br>
    <label>
        Combination Length:
        <input type="number" id="combination-length" value="24" min="1">
    </label>
    <p>Total Combinations: <span id="total-combinations"></span></p>
    <p>Combinations Tried: <span id="combinations-tried">0</span></p>
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>
    <div>
        <button id="start-btn">Start Brute Force</button>
        <button id="pause-btn" disabled>Pause</button>
        <button id="resume-btn" disabled>Resume</button>
    </div>
    <div id="output"></div>

<script>
    const charset = "abcdefghijklmnopqrstuvwxyz0123456789";
    let targetHash = "0fad2932464a554f7a2d07fd87a44a2686dc65c7e6dd87f911707e8a33b4529e";
    let length = 24;
    const chunkSize = 1000;
    const maxLogEntries = 5;
    const maxSetSize = 500000; // Maximum size of each set of tried combinations

    const totalCombinationsDisplay = document.getElementById("total-combinations");
    const combinationsTriedDisplay = document.getElementById("combinations-tried");
    const progressBar = document.getElementById("progress-bar");
    const outputDiv = document.getElementById("output");
    const startBtn = document.getElementById("start-btn");
    const pauseBtn = document.getElementById("pause-btn");
    const resumeBtn = document.getElementById("resume-btn");
    const targetHashInput = document.getElementById("target-hash");
    const combinationLengthInput = document.getElementById("combination-length");

    let combinationsTried = 0;
    let running = false;
    let triedCombinations = new Set(); // Initialize the first set
    let logCount = 0;

    function updateTotalCombinations() {
        const totalCombinations = BigInt(charset.length) ** BigInt(length);
        totalCombinationsDisplay.textContent = totalCombinations.toLocaleString();
    }

    function sha256(message) {
        return CryptoJS.SHA256(message).toString(CryptoJS.enc.Hex);
    }

    function generateRandomString(length) {
        let randomString = "";
        for (let i = 0; i < length; i++) {
            const randomIndex = Math.floor(Math.random() * charset.length);
            randomString += charset[randomIndex];
        }
        return randomString;
    }

   async function bruteForceChunk() {
    for (let i = 0; i < chunkSize; i++) {
        if (!running) return false;

        const candidate = generateRandomString(length);
        if (triedCombinations.size >= maxSetSize) {
            triedCombinations = new Set(); // Reset the set if max size is reached
        }

        if (triedCombinations.has(candidate)) {
            continue;
        }
        triedCombinations.add(candidate);

        const candidateHash = sha256(candidate);
        combinationsTried++;
        updateStats();

        // Append log to outputDiv
        const logEntry = `Trying: ${candidate} -> ${candidateHash}\n`;
        outputDiv.textContent += logEntry;

        // Scroll to bottom of outputDiv
        outputDiv.scrollTop = outputDiv.scrollHeight;

        // Manage log overflow
        logCount++;
        if (logCount >= maxLogEntries) {
            const logs = outputDiv.textContent.split("\n");
            outputDiv.textContent = logs.slice(-maxLogEntries).join("\n");
            logCount = outputDiv.textContent.split("\n").length; // Update logCount
        }

        if (candidateHash === targetHash) {
            outputDiv.textContent += `Match found! The string is: ${candidate}\n`;
            outputDiv.scrollTop = outputDiv.scrollHeight;
            return true;
        }
    }
    return false;
}


    function updateStats() {
        combinationsTriedDisplay.textContent = combinationsTried.toLocaleString();
        const progress = (combinationsTried / Number(BigInt(charset.length) ** BigInt(length))) * 100;
        progressBar.style.width = `${progress.toFixed(6)}%`;
    }

    async function bruteForce() {
        startBtn.disabled = true;
        pauseBtn.disabled = false;
        resumeBtn.disabled = true;

        running = true;
        outputDiv.textContent += "Starting brute force...\n";

        while (running) {
            const found = await bruteForceChunk();
            if (found) break;
            await new Promise((resolve) => setTimeout(resolve, 10));
        }

        if (!running) {
            outputDiv.textContent += "Brute force paused.\n";
            return;
        }

        startBtn.disabled = false;
        pauseBtn.disabled = true;
        outputDiv.textContent += "Brute force complete.\n";
    }

    function pauseBruteForce() {
        running = false;
        pauseBtn.disabled = true;
        resumeBtn.disabled = false;
    }

    function resumeBruteForce() {
        resumeBtn.disabled = true;
        pauseBtn.disabled = false;

        running = true;
        bruteForce();
    }

    startBtn.addEventListener("click", () => {
    // Update targetHash and length from user input
    targetHash = targetHashInput.value.trim(); // Trim spaces for safety
    length = parseInt(combinationLengthInput.value, 10);
    
    if (!targetHash || targetHash.length !== 64) {
        outputDiv.textContent += "Invalid target hash. Please enter a valid 64-character SHA-256 hash.\n";
        return;
    }

    updateTotalCombinations(); // Update total combinations based on new length
    combinationsTried = 0; // Reset the counter for combinations tried
    triedCombinations.clear(); // Clear the tried combinations set
    outputDiv.textContent = ""; // Clear the output log
    bruteForce(); // Start brute force
});


    pauseBtn.addEventListener("click", pauseBruteForce);
    resumeBtn.addEventListener("click", resumeBruteForce);
</script>


</body>
</html>
