<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHA-256 Brute Force</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
        }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            text-align: left;
            max-height: 300px;
            overflow-y: scroll;
            border: 1px solid #333;
            padding: 10px;
            background-color: #1e1e1e;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #4caf50;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        input {
            margin: 10px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>
    <h1>SHA-256 Brute Force</h1>
    <label>
        Target Hash:
        <input type="text" id="target-hash" placeholder="Enter target hash" value="0fad2932464a554f7a2d07fd87a44a2686dc65c7e6dd87f911707e8a33b4529e">
    </label>
    <br>
    <label>
        Combination Length:
        <input type="number" id="combination-length" value="24" min="1">
    </label>
    <div>
        <button id="start-btn">Start Brute Force</button>
        <button id="pause-btn" disabled>Pause</button>
        <button id="resume-btn" disabled>Resume</button>
    </div>
    <div>
        Combinations Tried: <span id="combinations-tried">0</span>
    </div>
    <div id="output"></div>

<script>
    const charset = "abcdefghijklmnopqrstuvwxyz0123456789";
    let targetHash = "0fad2932464a554f7a2d07fd87a44a2686dc65c7e6dd87f911707e8a33b4529e";
    let length = 24;
    const chunkSize = 1000;
    const maxLogEntries = 5;
    const maxSetSize = 10000000; // Increased Set size for large tracking

    const combinationsTriedDisplay = document.getElementById("combinations-tried");
    const outputDiv = document.getElementById("output");
    const startBtn = document.getElementById("start-btn");
    const pauseBtn = document.getElementById("pause-btn");
    const resumeBtn = document.getElementById("resume-btn");
    const targetHashInput = document.getElementById("target-hash");
    const combinationLengthInput = document.getElementById("combination-length");

    let combinationsTried = 0;
    let running = false;
    let triedCombinations = new Set();
    let logCount = 0;

    async function sha256(message) {
        const encoder = new TextEncoder();
        const data = encoder.encode(message);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuffer))
            .map((b) => b.toString(16).padStart(2, "0"))
            .join("");
    }

    function generateRandomStringMethod1(length) {
        let randomString = "";
        for (let i = 0; i < length; i++) {
            const randomIndex = Math.floor(Math.random() * charset.length);
            randomString += charset[randomIndex];
        }
        return randomString;
    }

    function generateRandomStringMethod2(length) {
        const randomIndex = Math.floor(Math.random() * charset.length);
        const sliceStart = Math.min(randomIndex, charset.length - length);
        return charset.slice(sliceStart, sliceStart + length).padEnd(length, charset[0]);
    }

    function generateRandomStringMethod3(length) {
        const shuffledCharset = charset.split('').sort(() => 0.5 - Math.random()).join('');
        return shuffledCharset.slice(0, length);
    }

    function generateRandomStringMethod4(length) {
        const start = Math.floor(Math.random() * charset.length);
        const reversed = charset.split('').reverse().join('');
        return reversed.slice(start, start + length).padEnd(length, charset[0]);
    }

    function generateRandomString(length) {
        const methods = [
            generateRandomStringMethod1,
            generateRandomStringMethod2,
            generateRandomStringMethod3,
            generateRandomStringMethod4,
        ];
        const randomMethod = methods[Math.floor(Math.random() * methods.length)];
        return randomMethod(length);
    }

    function manageSetSize() {
        if (triedCombinations.size >= maxSetSize) {
            console.log(`Set size exceeded ${maxSetSize}. Clearing old entries to save memory.`);
            triedCombinations = new Set([...triedCombinations].slice(-maxSetSize / 2)); // Retain last entries
        }
    }

    function addToSet(candidate) {
        triedCombinations.add(candidate);
        manageSetSize();
    }

    async function bruteForceChunk() {
        for (let i = 0; i < chunkSize; i++) {
            if (!running) return false;

            const candidate = generateRandomString(length);

            if (triedCombinations.has(candidate)) {
                continue;
            }

            addToSet(candidate);

            const candidateHash = await sha256(candidate);
            combinationsTried++;
            combinationsTriedDisplay.textContent = combinationsTried.toLocaleString();

            const logEntry = `Trying: ${candidate} -> ${candidateHash}\n`;
            outputDiv.textContent += logEntry;
            outputDiv.scrollTop = outputDiv.scrollHeight;

            logCount++;
            if (logCount >= maxLogEntries) {
                const logs = outputDiv.textContent.split("\n");
                outputDiv.textContent = logs.slice(-maxLogEntries).join("\n");
                logCount = outputDiv.textContent.split("\n").length;
            }

            if (candidateHash === targetHash) {
                outputDiv.textContent += `Match found! The string is: ${candidate}\n`;
                outputDiv.scrollTop = outputDiv.scrollHeight;
                return true;
            }
        }
        return false;
    }

    async function bruteForce() {
        startBtn.disabled = true;
        pauseBtn.disabled = false;
        resumeBtn.disabled = true;

        running = true;
        outputDiv.textContent += "Starting brute force...\n";

        while (running) {
            const found = await bruteForceChunk();
            if (found) break;
            await new Promise((resolve) => setTimeout(resolve, 10));
        }

        if (!running) {
            outputDiv.textContent += "Brute force paused.\n";
            return;
        }

        startBtn.disabled = false;
        pauseBtn.disabled = true;
        outputDiv.textContent += "Brute force complete.\n";
    }

    function pauseBruteForce() {
        running = false;
        pauseBtn.disabled = true;
        resumeBtn.disabled = false;
    }

    function resumeBruteForce() {
        resumeBtn.disabled = true;
        pauseBtn.disabled = false;

        running = true;
        bruteForce();
    }

    startBtn.addEventListener("click", () => {
        targetHash = targetHashInput.value.trim();
        length = parseInt(combinationLengthInput.value, 10);

        if (!targetHash || targetHash.length !== 64) {
            outputDiv.textContent += "Invalid target hash. Please enter a valid 64-character SHA-256 hash.\n";
            return;
        }

        combinationsTried = 0;
        triedCombinations.clear();
        outputDiv.textContent = "";
        bruteForce();
    });

    pauseBtn.addEventListener("click", pauseBruteForce);
    resumeBtn.addEventListener("click", resumeBruteForce);
</script>

</body>
</html>
